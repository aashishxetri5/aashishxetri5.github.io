<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      The admin surface must never be indexed. It is also excluded from the
      sitemap by living in public/ rather than being an Astro route, and
      disallowed in robots.txt — three independent mechanisms, because a
      login screen appearing in search results is a bad look and each of the
      three can be defeated on its own.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content admin — AASHISH.OS</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      /* Pre-boot state only. The CMS replaces the body once it loads. */
      body {
        margin: 0;
        background: #0a0a0b;
        color: #edebe6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .boot {
        padding: 2rem;
        font-size: 0.875rem;
      }
      .boot a {
        color: #ffab2e;
      }
    </style>
  </head>

  <body>
    <div class="boot">
      <p>Loading content admin…</p>
      <p>
        If this does not load, edit content directly in
        <code>content/</code> — the CMS is a convenience layer over the same
        files, never the only way to publish.
        <a href="/">Back to the site</a>
      </p>
    </div>

    <!--
      Sveltia CMS, pinned to an exact version.

      Pinned deliberately: this is an admin tool with write access to the
      repository, and a floating range means it can change under you between
      one edit session and the next. Sveltia is pre-1.0 and explicitly warns of
      breaking changes before then, which makes a floating range worse here than
      it would be for an ordinary dependency.

      To upgrade: bump the version, open /admin, confirm every collection still
      loads and saves, then commit. Rolling back is editing this one line.

      Falling back to Decap is a one-line swap — the config format is shared.
      See docs/cms.md.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.206.1/dist/sveltia-cms.js"></script>
  </body>
</html>

# AASHISH.OS — content admin configuration
#
# Satisfies PLAN.md §39: "I can update my portfolio without touching source
# code." Every field below maps to a field in src/content.config.ts, and
# scripts/lib/cms-drift.mjs fails the build if the two ever disagree — a CMS
# that has quietly fallen behind the schema is worse than no CMS, because it
# looks authoritative while omitting fields.
#
# Editing here is a convenience, never a requirement. The files in content/ are
# plain Markdown and YAML in git; this is one way to edit them, not the way
# (§22 portability).

backend:
  name: github
  repo: aashishxetri5/aashishxetri5.github.io

  # ⚠️ MUST equal the branch Netlify deploys. Currently the rebuild branch.
  # Phase 11 cutover changes this to `main` — tracked as an explicit step in
  # PLAN.md so it cannot be forgotten silently.
  branch: portfolio-v4

# THE most important line in this file.
#
# ADR-002 reaffirmed Netlify with its credit-based free tier: roughly 20
# PRODUCTION deploys per month, and overage pauses the site rather than
# throttling it. Without editorial workflow every single content save would be a
# direct commit to the deploy branch — i.e. a 15-credit production deploy — so
# about twenty edits would exhaust the month and take the site offline.
#
# Editorial workflow turns each edit into a pull request instead. Branch deploys
# and deploy previews cost 0 credits, so you can draft freely and pay for one
# production deploy when you merge. This is a hard architectural requirement
# recorded in ADR-002, not a preference.
publish_mode: editorial_workflow

# Repo-root media default. Collections that keep images beside their content
# override this — see the per-collection media_folder entries below.
media_folder: public/images
public_folder: /images

collections:
  # ── Profile ──────────────────────────────────────────────────────────────
  - name: profile
    label: Profile
    delete: false
    editor: { preview: false }
    files:
      - name: profile
        label: Profile
        file: content/profile/profile.yaml
        # Images live beside the content they belong to, and are referenced
        # relatively, so the CMS must write `./images/x.jpg` rather than an
        # absolute path.
        media_folder: images
        public_folder: ./images
        fields:
          - { name: name, label: Name, widget: string }
          - {
              name: headline,
              label: Headline,
              widget: string,
              hint: One line. Used in the hero and the page title.,
            }
          - {
              name: shortBio,
              label: Short bio,
              widget: text,
              hint: About two sentences. Becomes the meta description and social preview text.,
            }
          - {
              name: longBio,
              label: Long bio,
              widget: text,
              hint: Blank line between paragraphs. Drives the About section.,
            }
          - { name: location, label: Location, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: avatar, label: Portrait, widget: image }
          - {
              name: ogImage,
              label: Social preview image,
              widget: image,
              required: false,
              hint: Optional. Falls back to the portrait.,
            }
          - name: resume
            label: Résumé
            widget: object
            required: false
            collapsed: true
            hint: Leave empty until a PDF exists in public/resume/. An absent résumé hides the buttons; it never renders a broken link.
            fields:
              - {
                  name: file,
                  label: File path,
                  widget: string,
                  hint: "Path under public/, e.g. resume/aashish-katwal-resume.pdf",
                }
              - { name: updated, label: Last updated, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { name: label, label: Button label, widget: string, default: Résumé, required: false }
          - name: availability
            label: Availability
            widget: object
            fields:
              - {
                  name: open,
                  label: Open to opportunities,
                  widget: boolean,
                  default: true,
                  hint: Drives the status indicator across the whole site.,
                }
              - { name: message, label: Message, widget: string, required: false }
          - name: socials
            label: Social links
            widget: object
            collapsed: true
            fields:
              - { name: github, label: GitHub, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: website, label: Website, widget: string, required: false }
              - { name: hashnode, label: Hashnode, widget: string, required: false }
              - { name: x, label: X, widget: string, required: false }

  # ── Experience ───────────────────────────────────────────────────────────
  - name: experience
    label: Experience
    label_singular: Role
    folder: content/experience
    create: true
    extension: md
    format: frontmatter
    media_folder: images
    public_folder: ./images
    summary: "{{fields.role}} — {{fields.company}}"
    sortable_fields: [startDate, company]
    fields:
      - { name: company, label: Company, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: location, label: Location, widget: string, required: false }
      - name: employmentType
        label: Employment type
        widget: select
        options:
          [
            full-time,
            part-time,
            contract,
            freelance,
            internship,
            hackathon,
            self-employed,
          ]
      - { name: startDate, label: Start date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - {
          name: endDate,
          label: End date,
          widget: datetime,
          format: YYYY-MM-DD,
          date_format: YYYY-MM-DD,
          time_format: false,
          required: false,
          hint: Leave empty if this is your current role, and tick Current below. The build fails if both are set.,
        }
      - {
          name: current,
          label: Current role,
          widget: boolean,
          default: false,
          hint: "Drives the 2026 — Present label and the Current marker. Never hardcoded anywhere.",
        }
      - { name: logo, label: Logo, widget: image, required: false }
      - { name: website, label: Website, widget: string, required: false }
      - { name: summary, label: Summary, widget: text, hint: One line, shown in the collapsed timeline. }
      - { name: responsibilities, label: Responsibilities, widget: list, required: false, default: [] }
      - { name: achievements, label: Achievements, widget: list, required: false, default: [] }
      - { name: technologies, label: Technologies, widget: list, required: false, default: [] }
      - name: links
        label: Links
        widget: list
        required: false
        default: []
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: order, label: Manual sort order, widget: number, required: false, hint: Tiebreak only. Sorting is otherwise derived from dates. }
      - { name: body, label: Description, widget: markdown, required: false }

  # ── Projects ─────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    extension: mdx
    format: frontmatter
    media_folder: images
    public_folder: ./images
    summary: "{{fields.name}} ({{fields.status}})"
    sortable_fields: [name, status, startDate]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: shortDescription, label: Short description, widget: text, hint: One or two lines. Used on cards and in the terminal listing. }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - name: status
        label: Status
        widget: select
        options: [active, completed, archived, experimental]
        default: completed
      - name: type
        label: Type
        widget: select
        options: [web, backend, library, tool, game, experiment, other]
        default: web
      - { name: startDate, label: Start date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false }
      - { name: image, label: Screenshot, widget: image, required: false }
      - { name: technologies, label: Technologies, widget: list, hint: At least one is required. }
      - name: links
        label: Links
        widget: object
        collapsed: true
        fields:
          - { name: github, label: Source, widget: string, required: false }
          - { name: demo, label: Live demo, widget: string, required: false }
          - { name: documentation, label: Documentation, widget: string, required: false }

      # Dossier fields. Every one is optional and each section omits itself when
      # empty, so filling in only some is fine — see content/README.md.
      - {
          name: problem,
          label: Problem,
          widget: text,
          required: false,
          hint: What problem this solved, and for whom.,
        }
      - { name: highlights, label: Highlights, widget: list, required: false, default: [] }
      - {
          name: architecture,
          label: Architecture,
          widget: list,
          required: false,
          default: [],
          hint: Ordered steps — these render as a connected flow diagram, so sequence matters.,
        }
      - name: decisions
        label: Engineering decisions
        widget: list
        required: false
        default: []
        fields:
          - { name: decision, label: Decision, widget: string }
          - { name: reason, label: Reason, widget: text, hint: Why, and what you traded away. }
      - { name: challenges, label: Challenges, widget: list, required: false, default: [] }
      - { name: lessons, label: What I'd do differently, widget: list, required: false, default: [] }
      - { name: order, label: Manual sort order, widget: number, required: false }
      - { name: body, label: Overview, widget: markdown, required: false }

  # ── Skills ───────────────────────────────────────────────────────────────
  #
  # A single YAML file holding an array, so this is a `files` collection with a
  # list widget rather than a folder of one file per skill.
  - name: skills
    label: Skills
    delete: false
    editor: { preview: false }
    files:
      - name: skills
        label: All skills
        file: content/skills/skills.yaml
        fields:
          - name: skills
            label: Skills
            widget: list
            label_singular: Skill
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { name: id, label: ID, widget: string, hint: "Lowercase, hyphenated, unique — e.g. spring-boot." }
              - { name: name, label: Name, widget: string }
              - name: category
                label: Category
                widget: select
                options:
                  [
                    Languages,
                    Backend,
                    Frontend,
                    Databases,
                    DevOps,
                    Cloud,
                    Tools,
                    Concepts,
                    Other,
                  ]
              - name: level
                label: Level
                widget: select
                options: [learning, working, proficient, advanced]
                hint: A coarse enum on purpose. §8 rejects invented percentages.
              - {
                  name: since,
                  label: Using since,
                  widget: datetime,
                  format: YYYY-MM-DD,
                  date_format: YYYY-MM-DD,
                  time_format: false,
                  required: false,
                  hint: Optional. Switches on a derived "Ny" longevity label.,
                }
              - { name: icon, label: Icon, widget: string, required: false }
              # Relation widgets, so evidence is picked from real entries rather
              # than typed. A broken reference already fails the build; this
              # stops one being created in the first place.
              - {
                  name: projects,
                  label: Evidenced by projects,
                  widget: relation,
                  collection: projects,
                  search_fields: [name],
                  value_field: "{{filename}}",
                  display_fields: [name],
                  multiple: true,
                  required: false,
                  default: [],
                }
              - {
                  name: companies,
                  label: Evidenced by roles,
                  widget: relation,
                  collection: experience,
                  search_fields: [company, role],
                  value_field: "{{filename}}",
                  display_fields: [company],
                  multiple: true,
                  required: false,
                  default: [],
                }
              - { name: featured, label: Featured, widget: boolean, default: false }
              - { name: order, label: Manual sort order, widget: number, required: false }

  # ── Education ────────────────────────────────────────────────────────────
  - name: education
    label: Education
    label_singular: Qualification
    folder: content/education
    create: true
    extension: md
    format: frontmatter
    media_folder: images
    public_folder: ./images
    summary: "{{fields.degree}} — {{fields.institution}}"
    fields:
      - { name: institution, label: Institution, widget: string }
      - { name: degree, label: Degree, widget: string }
      - { name: field, label: Field of study, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: startDate, label: Start date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - {
          name: endDate,
          label: End date,
          widget: datetime,
          format: YYYY-MM-DD,
          date_format: YYYY-MM-DD,
          time_format: false,
          required: false,
          hint: Leave empty if still studying, and tick Current.,
        }
      - { name: current, label: Currently studying, widget: boolean, default: false }
      - { name: grade, label: Grade, widget: string, required: false }
      - { name: logo, label: Logo, widget: image, required: false }
      - { name: highlights, label: Highlights, widget: list, required: false, default: [] }
      - { name: body, label: Notes, widget: markdown, required: false }

  # ── Achievements ─────────────────────────────────────────────────────────
  - name: achievements
    label: Achievements
    label_singular: Achievement
    folder: content/achievements
    create: true
    extension: md
    format: frontmatter
    summary: "{{fields.title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: issuer, label: Issuer, widget: string, required: false }
      - { name: date, label: Date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - name: type
        label: Type
        widget: select
        options: [certification, award, recognition, publication, talk, other]
      - { name: credentialUrl, label: Credential URL, widget: string, required: false }
      - { name: credentialId, label: Credential ID, widget: string, required: false }
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: body, label: Notes, widget: markdown, required: false }

  # ── Writing ──────────────────────────────────────────────────────────────
  - name: posts
    label: Writing
    label_singular: Article
    folder: content/posts
    create: true
    extension: mdx
    format: frontmatter
    media_folder: images
    public_folder: ./images
    summary: "{{fields.title}}"
    sortable_fields: [publishDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: publishDate, label: Published, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { name: summary, label: Summary, widget: text }
      - {
          name: external,
          label: External URL,
          widget: string,
          required: false,
          hint: Set this and the entry links out. Leave empty to publish the body below on this site instead.,
        }
      - { name: canonical, label: Canonical URL, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: Drafts never reach a production build. }
      - { name: body, label: Body, widget: markdown, required: false }

projects:
  # REAL — from the v3 site.
  # ⭐ Highest-value edit on the site: add problem / architecture / decisions.
  - id: pustakalaya
    name: Pustakalaya
    shortDescription: >-
      A library management system with separate librarian and member panels,
      built on JSP/Servlet and JDBC.
    featured: true
    status: completed
    type: web
    image: ./images/pustakalaya.jpeg
    technologies: [Java, JSP, Servlet, JDBC, MySQL]
    links:
      github: https://github.com/aashishxetri5/Pustakalaya
    body: |
      A library management system with two roles. The **admin (librarian)** panel
      manages the catalogue; the **member** panel lets members borrow books and see
      what they currently have out.

      Built with JSP and Servlets over JDBC.

  # REAL — from the v3 site (v3 misspelled it "Image Extactor").
  - id: image-extractor
    name: Image Extractor
    shortDescription: >-
      Extracts every image from a given URL and lists them alongside their
      names, using the Jsoup library.
    featured: false
    status: completed
    type: tool
    image: ./images/image-extractor.jpeg
    technologies: [Java, Jsoup]
    links:
      github: https://github.com/aashishxetri5/ImageExtractor
    body: |
      Give it a URL and it scrapes the page for images, then displays each one along
      with its name. Uses [Jsoup](https://jsoup.org/) to parse the HTML.

      The owner also wrote up the underlying technique — see the "Web Scraping with
      Java Jsoup" post under Writing.

  # REAL — from the v3 site.
  - id: buzzwire
    name: Buzzwire
    shortDescription: >-
      A browser take on the old-school buzz wire game — steer the cursor along
      the wire without touching the edges.
    featured: false
    status: completed
    type: game
    image: ./images/buzzwire.jpg
    technologies: [HTML, CSS, JavaScript]
    links:
      github: https://github.com/aashishxetri5/Buzzwire
      demo: https://aashishxetri5.github.io/Buzzwire/
    body: |
      Just like that old school science project: move your cursor through the wire
      without it getting out of the line, and you win.

      Plain HTML, CSS and JavaScript — no libraries.


# ══════════════════════════════════════════════════════════════════════════════
#  AASHISH.OS — ALL PORTFOLIO CONTENT LIVES IN THIS ONE FILE
# ══════════════════════════════════════════════════════════════════════════════
#
#  Edit, save, and the site updates. `npm run dev` reloads it live.
#  Nothing else needs to change to add a job, a project, a skill or a post.
#
#  Rules of thumb
#  ──────────────
#  • Every entry in a list needs an `id:` — lowercase letters, numbers and
#    dashes (e.g. `my-project`). For projects and posts it is the URL:
#    /projects/my-project. Skills refer to projects and jobs by id.
#  • Quote dates: "2023" or "2023-04-01". Unquoted, YAML reads 2023 as a
#    number and the build will stop you.
#  • `body: |` is Markdown, shown on a project's or post's own page.
#    Everywhere else, use `summary:`.
#  • Typos fail the build with a message saying what and where. A misspelled
#    field is an error, not silently ignored.
#
#  Markers used in the comments below:
#    REAL         migrated from your v3 site — your own words
#    CONFIRM      real, but may be out of date; check it
#    PLACEHOLDER  not real; replace or delete before launch
#
#  Field reference: docs/content-model.md · Editing guide: content/README.md
# ══════════════════════════════════════════════════════════════════════════════



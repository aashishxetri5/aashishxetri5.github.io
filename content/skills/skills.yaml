# Skills. Schema: src/content.config.ts — one array, each entry needs an `id`.
#
# PLAN.md §8 rejects invented percentages ("Java: 97%") as arbitrary. Instead,
# `level` is a coarse four-value enum and evidence comes from the `projects`
# and `companies` reference lists below. Those are validated at build time:
# pointing at a project that does not exist fails the build.
#
# All entries below are REAL — migrated from the v3 site's skills section and
# résumé page. Evidence links point only at real projects; no placeholder is
# ever cited as evidence for a real skill.
#
# `since` is omitted throughout: the v3 site gave no reliable start dates, and
# guessing them would be fabrication (Rule 3). Adding `since: "2021"` to any
# entry switches on derived longevity — see src/lib/dates.ts `yearsSince`.

